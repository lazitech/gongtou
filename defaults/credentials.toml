# Patterns are absolute after replacing {home}, {codex_home}, or {workspace}.
# SSH private keys with other names must be added explicitly. Existing id_*
# names are enumerated; newly created id_* names ending in b need explicit rules.
# Public keys, config and known_hosts are intentionally not blocked.
# The broad {workspace}/**/.env* rule also hides templates such as .env.example.
# If templates must be readable, replace that one entry with the following four
# entries (keep the commas between entries):
#   "{workspace}/**/.env", "{workspace}/**/.env.local",
#   "{workspace}/**/.env.production", "{workspace}/**/.env.development"
# This protects only those exact names at any depth. Other names, such as
# .env.staging or .env.production.local, become readable and stageable;
# explicitly add every secret name used by the project before using this option.
deny = [
  "{home}/.ssh/id_*", "{home}/.ssh/*_key", "{home}/.ssh/*.pem", "{home}/.ssh/*.key",
  "{home}/.aws", "{home}/.config/gh", "{home}/.gnupg",
  "{home}/.netrc", "{home}/.git-credentials", "{home}/.pypirc", "{home}/.claude.json",
  "{home}/.config/gcloud", "{home}/.azure",
  "{home}/.kube", "{home}/.docker/config.json",
  "{home}/.config/google-chrome", "{home}/.mozilla",
  "{home}/.config/chromium", "{home}/.claude/.credentials.json",
  "{home}/.cache/huggingface/token", "{home}/.huggingface/token",
  "{home}/.local/share/keyrings", "{home}/.config/keyring",
  "{home}/.codex/auth.json", "{home}/.codex/config.toml",
  "{codex_home}/auth.json", "{codex_home}/config.toml", "{home}/.zeron/ipc-token",
  "{home}/.zeron/session.json", "{home}/.zeron/agent-accounts",
  "{home}/.zeron/browser", "{workspace}/**/.env*"
]
